<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>Разнарядка</title>
  <!-- Своя копия скрипта Telegram: приложение откроется, даже если telegram.org недоступен -->
  <script src="/static/vendor/telegram-web-app.js?v={{V}}"></script>
  <link rel="stylesheet" href="/static/style.css?v={{V}}">
</head>
<body>
  <main id="app"><div class="loading">Загрузка…</div></main>
  <nav id="tabs" class="tabs hidden"></nav>
  <div id="sheet-root"></div>
  <div id="net" class="net" hidden>📡 Нет интернета — изменения сохраняются на телефоне</div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js?v={{V}}"></script>
  <script>
    // Если app.js не загрузился (обрыв связи) — не оставляем вечное «Загрузка…»
    setTimeout(function () {
      if (window.__rzBooted) return;
      document.getElementById('app').innerHTML =
        '<div class="center-msg"><div class="big-emoji">📡</div><h2>Не загрузилось</h2>' +
        '<p>Похоже, пропала связь. Проверьте интернет и попробуйте ещё раз.</p>' +
        '<button class="btn btn-secondary" onclick="location.reload()">Повторить</button></div>';
    }, 15000);
  </script>
</body>
</html>

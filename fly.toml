# Fly.io: бот + мини-апп на https://<app>.fly.dev
# Одна машина, всегда включена (бот опрашивает Telegram — засыпать ему нельзя),
# две машины с одним токеном мешают друг другу — поэтому деплой только с --ha=false.
# Токен: fly secrets set BOT_TOKEN=...   (не в этом файле!)

app = "raznaryadka"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "20s"
# Подкачка на случай всплеска памяти — вместо падения бот просто притормозит
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  WEBAPP_URL = "https://raznaryadka.fly.dev"
  USE_NGROK = "0"
  HOST = "0.0.0.0"
  PORT = "8080"
  # Время в логах — как на площадке (UTC+3)
  TZ = "MSK-3"

# Постоянный диск: база, логи, ежедневные копии
[[mounts]]
  source = "razn_data"
  destination = "/app/data"
  initial_size = "3gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[[restart]]
  policy = "always"
